[project]
name = "sagar-drishti"
version = "1.0.0"
description = "Antarctic iceberg monitoring and GRU trajectory forecasting platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "tf: requires TensorFlow/Keras",
    "db: requires a PostGIS database (TEST_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "tests"]
